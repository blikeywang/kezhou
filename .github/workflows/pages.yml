name: publish-traderhome

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'prototype/**'
      - 'tools/market_simulation/**'
      - '.github/workflows/pages.yml'
      - 'CNAME'
  schedule:
    - cron: '6-56/10 * * * *'
  workflow_run:
    workflows: [daily-refresh]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish existing snapshots without executing paper plans (legacy clock defaults false)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: traderhome-pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check public exporter and portal
        run: |
          python -m unittest discover -s tools/market_simulation -p 'test_*.py'
          python -m unittest portal.test_portal
          node --test portal/test_market_simulation.mjs
          node --test portal/test_history_universe.mjs
          node --test portal/test_history_replay.mjs
          node --test tools/daily-trade/test_export_public.mjs tools/scheduler/test_refresh_runner.mjs tools/incomeos/test_data_quality.mjs tools/incomeos/test_research_publication.mjs
          node --test portal/test_site_display.mjs
      - name: Build public pages
        run: python portal/build_site.py --output _site
      - name: Select publication mode
        id: publication_policy
        env:
          PUBLICATION_EVENT: ${{ github.event_name }}
          PUBLISH_ONLY: ${{ inputs.publish_only || false }}
        run: python tools/market_simulation/publication_policy.py
      - name: Execute current paper plans before publication
        id: paper_cycle
        if: steps.publication_policy.outputs.run_paper_cycle == 'true'
        continue-on-error: true
        env:
          MARKET_SIMULATION_SITE_TOKEN: ${{ secrets.MARKET_SIMULATION_SITE_TOKEN }}
        run: python tools/market_simulation/run_cycle.py
      - name: Read paper positions, plans, fills and hourly reviews
        env:
          MARKET_SIMULATION_SITE_TOKEN: ${{ secrets.MARKET_SIMULATION_SITE_TOKEN }}
          PAPER_CYCLE_OUTCOME: ${{ steps.paper_cycle.outcome }}
        run: python tools/market_simulation/export_public.py --output _site/market-simulation/data
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages processes one deployment at a time and is occasionally slow
    # (GitHub incidents, large artifacts). A create can also be refused with
    # "in progress deployment" for a few minutes after the previous run has
    # already finished (seen 2026-11-10 after a large data push). Try three
    # times: at once, after 90 seconds, then after four more minutes.
    # deploy-pages caps its own wait at 10 minutes. Job limit covers all three.
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url || steps.deploy_last.outputs.page_url }}
    steps:
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
          timeout: '600000'
      - name: Pause before retrying Pages deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
          timeout: '600000'
      - name: Pause before the last Pages deployment attempt
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: sleep 240
      - id: deploy_last
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
          timeout: '600000'
