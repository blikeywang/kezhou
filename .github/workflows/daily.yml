name: daily-refresh

# 每天刷新公开衍生数据；完成后由 publish-traderhome 统一部署。
on:
  push:
    branches: [main]
    paths:
      - "pipeline/daily/**"
      - "portal/**"
      - "tools/tailtrend/**"
      - "tools/otc/**"
      - "personal-data-hub/**"
      - "docs/METHODS_AND_SOURCES.md"
      - "docs/TRADERHOME_PRODUCT_SYSTEM.md"
      - "README.md"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "35 0 * * *"   # 加密 UTC 日线闭合后；同时检查股票已闭合日线
    - cron: "30 6 * * *"   # 每天 06:30 UTC(美股收盘后;加密 24h)
  workflow_dispatch: {}     # 也可在 Actions 页面手动触发

permissions:
  contents: write           # 提交刷新后的 app.html

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install deps
        run: pip install -r pipeline/daily/requirements.txt -r personal-data-hub/requirements-dev.txt

      - name: Run historical research regression tests
        run: python -m unittest discover -s pipeline/daily -p 'test_*.py'

      - name: Run TraderHome portal tests
        run: python -m unittest portal.test_portal

      - name: Run Personal Data Hub tests
        run: PYTHONPATH=personal-data-hub python -m unittest discover -s personal-data-hub/tests -v

      - name: Run browser engine tests
        run: node --test portal/test_review_engine.mjs portal/test_review_community.mjs portal/test_incomeos_engine.mjs portal/test_tailtrend_engine.mjs portal/test_otc_engine.mjs portal/test_history_universe.mjs portal/test_history_replay.mjs tools/incomeos/test_data_quality.mjs tools/tailtrend/test_publication_quality.mjs tools/scheduler/test_refresh_runner.mjs

      - name: Test public daily price ingestion
        run: python -m unittest discover -s tools/otc -p 'test_*.py'

      - name: Refresh OTC chart public daily prices (not OTC indices)
        run: python tools/otc/update_public_prices.py --data-dir portal/vendor/otc/data

      - name: Refresh data (fetch + build + inject)
        run: python pipeline/daily/run.py

      - name: Validate refreshed history snapshots
        run: node --test portal/test_history_universe.mjs portal/test_history_replay.mjs

      - name: Commit refreshed public data
        run: |
          git config user.name  "kezhou-bot"
          git config user.email "kezhou-bot@users.noreply.github.com"
          git add prototype/app.html prototype/history-profiles docs/HISTORY_COVERAGE_AUDIT.md portal/vendor/otc/data/prices.json
          if git commit -m "chore: daily data refresh $(date -u +%F)"; then
            # main may have moved while the refresh ran (manual pushes, OTC
            # source updates). Rebase and retry instead of silently dropping
            # the refreshed data.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              sleep $((attempt * 10))
            done
            echo "::error::Could not push refreshed data after 3 attempts"
            exit 1
          else
            echo "no changes to commit"
          fi
